<tx-chart-frame
  [height]="height()"
  [(size)]="size"
  [legendItems]="legendItems()"
  [showLegend]="legendShown()"
  [legendPosition]="legendPosition()"
  [legendAlign]="legendAlign()"
  [legendVariant]="legendVariant()"
  [legendTemplate]="legendTemplate()?.template"
  [empty]="isEmpty()"
  [loading]="loading()"
  [toolbar]="toolbar()"
  [exportName]="ariaLabel()"
  emptyIcon="chart-line"
  [summary]="summary()"
  [table]="dataTable()"
  [tooltip]="tooltip()"
  [tooltipTemplate]="tooltipTemplate()?.template"
  [panelStyle]="tokenStyle()"
  [parts]="passThrough()"
  [styled]="!isUnstyled()"
  [zoomable]="zoomable()"
  [zoomedIn]="!!view()"
  (zoomed)="zoomAt($event.x, $event.factor)"
  (panned)="panBy($event.dx)"
  (zoomReset)="resetZoom()"
  (pointer)="onPointer($event)"
  (navigate)="onNavigate($event)"
  (legendToggled)="onLegendToggle($event)"
  (legendHovered)="onLegendHover($event)"
  (tooltipClosed)="active.set(null)"
>
  @if (clipped()) {
    <svg:clipPath [attr.id]="uid + '-clip'">
      <svg:rect [attr.x]="clip().x" [attr.y]="clip().y" [attr.width]="clip().width" [attr.height]="clip().height" />
    </svg:clipPath>
  }
  <svg:g [tx-chart-axes]="layout().axes" [gridPart]="passThrough().grid" [axisPart]="passThrough().axis" />
  <svg:g [tx-chart-annotations]="annotationShapes()" layer="back" [part]="passThrough().annotation" />
  @if (crosshair(); as line) {
    <svg:line
      class="tx-line-chart__crosshair"
      [class]="passThrough().crosshair?.class"
      [style]="passThrough().crosshair?.style"
      [attr.x1]="line.x"
      [attr.x2]="line.x"
      [attr.y1]="line.y1"
      [attr.y2]="line.y2"
    />
  }
  <svg:g #layer class="tx-line-chart__layer" [attr.clip-path]="clipped() ? 'url(#' + uid + '-clip)' : null">
    @for (path of paths(); track path.key) {
      <svg:g
        class="tx-line-chart__series"
        [class.tx-line-chart__series--focused]="focusedSeries() === path.index"
        [class]="passThrough().series?.class"
        [style]="passThrough().series?.style"
        [style.--tx-line-chart-color]="path.color"
        [attr.data-series]="path.index"
      >
        @if (path.area) {
          <svg:linearGradient [attr.id]="path.gradient" x1="0" y1="0" x2="0" y2="1">
            <svg:stop class="tx-line-chart__stop-from" offset="0" [style.stop-color]="path.color" />
            <svg:stop class="tx-line-chart__stop-to" offset="0.95" [style.stop-color]="path.color" />
          </svg:linearGradient>
          <svg:path
            class="tx-line-chart__area"
            [class.tx-line-chart__area--stacked]="isStacked()"
            [class]="passThrough().area?.class"
            [style]="passThrough().area?.style"
            [attr.d]="path.area"
            [attr.fill]="'url(#' + path.gradient + ')'"
          />
        }
        <svg:path
          class="tx-line-chart__line"
          [class]="passThrough().line?.class"
          [style]="passThrough().line?.style"
          [attr.d]="path.line"
          [style.stroke]="path.color"
        />
        @for (marker of path.markers; track marker.index) {
          <svg:circle
            class="tx-line-chart__point"
            [class]="passThrough().marker?.class"
            [style]="passThrough().marker?.style"
            [attr.cx]="marker.x"
            [attr.cy]="marker.y"
            [style.fill]="path.color"
          />
        }
      </svg:g>
    }
    @for (point of activePoints(); track point.series) {
      <svg:circle class="tx-line-chart__halo" [attr.cx]="point.x" [attr.cy]="point.y" [style.fill]="point.color" />
      <svg:circle
        class="tx-line-chart__marker"
        [class]="passThrough().marker?.class"
        [attr.cx]="point.x"
        [attr.cy]="point.y"
        [style.fill]="point.color"
      />
    }
  </svg:g>
  <svg:g [tx-chart-annotations]="annotationShapes()" layer="front" [part]="passThrough().annotation" />
  @if (overview(); as strip) {
    <svg:g class="tx-line-chart__overview" [class]="passThrough().brush?.class" [style]="passThrough().brush?.style" [style.--tx-line-chart-color]="strip.color">
      <svg:rect class="tx-line-chart__overview-track" [attr.x]="strip.left" [attr.y]="strip.top" [attr.width]="strip.width" [attr.height]="strip.height" />
      <svg:path class="tx-line-chart__overview-area" [attr.d]="strip.area" />
      <svg:path class="tx-line-chart__overview-line" [attr.d]="strip.line" />
      <svg:rect class="tx-line-chart__overview-mask" [attr.x]="strip.left" [attr.y]="strip.top" [attr.width]="strip.x0 - strip.left" [attr.height]="strip.height" />
      <svg:rect class="tx-line-chart__overview-mask" [attr.x]="strip.x1" [attr.y]="strip.top" [attr.width]="strip.left + strip.width - strip.x1" [attr.height]="strip.height" />
      <svg:rect class="tx-line-chart__overview-window" [attr.x]="strip.x0" [attr.y]="strip.top" [attr.width]="strip.x1 - strip.x0" [attr.height]="strip.height" />
      <svg:rect class="tx-line-chart__overview-handle" [attr.x]="strip.x0 - 3" [attr.y]="strip.handleY" width="6" [attr.height]="strip.handleHeight" />
      <svg:rect class="tx-line-chart__overview-handle" [attr.x]="strip.x1 - 3" [attr.y]="strip.handleY" width="6" [attr.height]="strip.handleHeight" />
    </svg:g>
  }
</tx-chart-frame>
