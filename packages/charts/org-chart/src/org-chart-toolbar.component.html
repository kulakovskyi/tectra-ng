@let current = state();
@let text = labels();
<div class="tx-org-chart__actions">
  <tx-icon-field class="tx-org-chart__search">
    <tx-input-icon icon="search" />
    <input txInput type="search" [value]="query()" [placeholder]="text.search" [attr.aria-label]="text.search" (input)="onInput($event)" />
  </tx-icon-field>
  @if (current.hasQuery) {
    <tx-pill [tone]="current.matchCount ? 'primary' : 'warn'" [icon]="current.matchCount ? 'check' : 'search'" role="status">
      {{ current.matchCount ? matches(current.matchCount) : text.noMatches }}
    </tx-pill>
  }
  <div class="tx-org-chart__group tx-org-chart__zoom-group">
    <button
      txButton
      type="button"
      icon="search-minus"
      severity="secondary"
      outlined
      [txTooltip]="text.zoomOut"
      [attr.aria-label]="text.zoomOut"
      [disabled]="!current.canZoomOut"
      (click)="zoomOut.emit()"
    ></button>
    <button
      txButton
      type="button"
      class="tx-org-chart__zoom"
      [label]="current.zoomPercent + '%'"
      severity="secondary"
      outlined
      [txTooltip]="text.resetZoom"
      [attr.aria-label]="text.resetZoom + ', ' + current.zoomPercent + '%'"
      (click)="resetZoom.emit()"
    ></button>
    <button
      txButton
      type="button"
      icon="search-plus"
      severity="secondary"
      outlined
      [txTooltip]="text.zoomIn"
      [attr.aria-label]="text.zoomIn"
      [disabled]="!current.canZoomIn"
      (click)="zoomIn.emit()"
    ></button>
    <button
      txButton
      type="button"
      icon="expand"
      severity="secondary"
      outlined
      [txTooltip]="text.fit"
      [attr.aria-label]="text.fit"
      [disabled]="!current.hasContent"
      (click)="fit.emit()"
    ></button>
  </div>
  <div class="tx-org-chart__group tx-org-chart__expand-group">
    <button
      txButton
      type="button"
      icon="angle-double-down"
      [label]="text.expandAll"
      [attr.aria-label]="text.expandAll"
      severity="secondary"
      outlined
      [disabled]="!current.hasContent || current.allExpanded"
      (click)="expandAll.emit()"
    ></button>
    <button
      txButton
      type="button"
      icon="angle-double-up"
      [label]="text.collapseAll"
      [attr.aria-label]="text.collapseAll"
      severity="secondary"
      outlined
      [disabled]="current.noneExpanded"
      (click)="collapseAll.emit()"
    ></button>
  </div>
  <button
    txButton
    type="button"
    class="tx-org-chart__fullscreen"
    [icon]="current.isFullscreen ? 'window-minimize' : 'window-maximize'"
    [label]="current.isFullscreen ? text.exitFullscreen : text.fullscreen"
    [attr.aria-label]="current.isFullscreen ? text.exitFullscreen : text.fullscreen"
    [severity]="current.isFullscreen ? 'primary' : 'secondary'"
    [outlined]="!current.isFullscreen"
    (click)="fullscreen.emit()"
  ></button>
  <button
    txButton
    type="button"
    class="tx-org-chart__more"
    icon="sliders-h"
    severity="secondary"
    outlined
    aria-haspopup="dialog"
    [txTooltip]="moreLabel()"
    [attr.aria-label]="moreLabel()"
    [txPopoverTrigger]="more"
    (pointerdown)="measure()"
    (keydown.enter)="measure()"
    (keydown.space)="measure()"
  ></button>
  <tx-popover #more placement="bottom-end" [offset]="8" [arrow]="false" [ariaLabel]="moreLabel()" [unstyled]="unstyled()">
    <div class="tx-org-chart__menu" [attr.data-styled]="!unstyled() || null">
      @if (narrow()) {
        <div class="tx-org-chart__menu-zoom">
          <button
            txButton
            type="button"
            icon="search-minus"
            severity="secondary"
            outlined
            [attr.aria-label]="text.zoomOut"
            [disabled]="!current.canZoomOut"
            (click)="zoomOut.emit()"
          ></button>
          <button
            txButton
            type="button"
            class="tx-org-chart__menu-percent"
            [label]="current.zoomPercent + '%'"
            severity="secondary"
            outlined
            [attr.aria-label]="text.resetZoom + ', ' + current.zoomPercent + '%'"
            (click)="resetZoom.emit()"
          ></button>
          <button
            txButton
            type="button"
            icon="search-plus"
            severity="secondary"
            outlined
            [attr.aria-label]="text.zoomIn"
            [disabled]="!current.canZoomIn"
            (click)="zoomIn.emit()"
          ></button>
          <button
            txButton
            type="button"
            icon="expand"
            severity="secondary"
            outlined
            [attr.aria-label]="text.fit"
            [disabled]="!current.hasContent"
            (click)="fit.emit()"
          ></button>
        </div>
      }
      <button
        txButton
        type="button"
        class="tx-org-chart__menu-item"
        icon="angle-double-down"
        [label]="text.expandAll"
        severity="secondary"
        text
        [disabled]="!current.hasContent || current.allExpanded"
        (click)="expandAll.emit(); more.hide()"
      ></button>
      <button
        txButton
        type="button"
        class="tx-org-chart__menu-item"
        icon="angle-double-up"
        [label]="text.collapseAll"
        severity="secondary"
        text
        [disabled]="current.noneExpanded"
        (click)="collapseAll.emit(); more.hide()"
      ></button>
      <button
        txButton
        type="button"
        class="tx-org-chart__menu-item"
        [icon]="current.isFullscreen ? 'window-minimize' : 'window-maximize'"
        [label]="current.isFullscreen ? text.exitFullscreen : text.fullscreen"
        severity="secondary"
        text
        (click)="fullscreen.emit(); more.hide()"
      ></button>
    </div>
  </tx-popover>
</div>
