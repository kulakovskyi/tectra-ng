<div class="tx-chips-input__box">
  @if (values().length) {
    <span class="tx-chips-input__list" role="list" [class]="passThrough().list?.class" [style]="passThrough().list?.style">
      @for (item of values(); track $index) {
        <tx-chip
          role="listitem"
          class="tx-chips-input__chip"
          [class]="passThrough().chip?.class"
          [style]="passThrough().chip?.style"
          [removable]="!disabled() && !readonly()"
          [removeIcon]="'times'"
          [removeLabel]="removeLabel(item)"
          (removed)="removeAt($index)"
        >
          @if (itemTemplate(); as template) {
            <ng-container [ngTemplateOutlet]="template.templateRef" [ngTemplateOutletContext]="{ $implicit: item, index: $index }" />
          } @else {
            {{ item }}
          }
        </tx-chip>
      }
    </span>
  }
  <input
    #field
    type="text"
    autocomplete="off"
    class="tx-chips-input__input"
    [class]="passThrough().input?.class"
    [style]="passThrough().input?.style"
    [attr.id]="inputId() ?? null"
    [attr.aria-label]="ariaLabel() ?? (ariaLabelledBy() || inputId() ? null : placeholder() || null)"
    [attr.aria-labelledby]="ariaLabelledBy() ?? null"
    [attr.aria-invalid]="isInvalid() || null"
    [attr.maxlength]="maxLength() ?? null"
    [placeholder]="values().length ? '' : placeholder()"
    [readOnly]="readonly() || isFull()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    (paste)="onPaste($event)"
    (keydown)="onKeydown($event)"
    (blur)="onBlur()"
  />
  @if (canClear()) {
    <button
      type="button"
      class="tx-chips-input__clear"
      [class]="passThrough().clear?.class"
      [style]="passThrough().clear?.style"
      [attr.aria-label]="translations().clear"
      (click)="clear()"
    >
      <tx-icon [name]="'times'" />
    </button>
  }
</div>
