<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- the combobox inside the box takes focus and keys; the box only widens the click area -->
<div
  #box
  #origin="cdkOverlayOrigin"
  cdkOverlayOrigin
  class="tx-select__box"
  [class]="passThrough().box?.class"
  [style]="passThrough().box?.style"
  (click)="onBoxClick($event)"
>
  <button
    #trigger
    type="button"
    role="combobox"
    class="tx-select__trigger"
    aria-haspopup="listbox"
    [class]="passThrough().trigger?.class"
    [style]="passThrough().trigger?.style"
    [attr.aria-invalid]="isInvalid() || null"
    [attr.aria-readonly]="readonly() || null"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="listboxId"
    [attr.id]="inputId() ?? null"
    [attr.aria-label]="ariaLabel() ?? (ariaLabelledBy() || inputId() ? null : placeholder() || null)"
    [attr.aria-labelledby]="ariaLabelledBy() ?? null"
    [attr.aria-activedescendant]="filter() ? null : activeItemId()"
    [attr.aria-busy]="loading() || null"
    [disabled]="disabled()"
    (keydown)="onKeydown($event)"
  >
    @if (!hasValue()) {
      <span class="tx-select__value tx-select__value--placeholder" [class]="passThrough().value?.class" [style]="passThrough().value?.style">{{
        placeholder()
      }}</span>
    } @else if (valueTemplate(); as template) {
      <span class="tx-select__value" [class]="passThrough().value?.class" [style]="passThrough().value?.style">
        <ng-container
          [ngTemplateOutlet]="template.templateRef"
          [ngTemplateOutletContext]="{ $implicit: selectedItems(), selected: true, disabled: false, index: -1 }"
        />
      </span>
    } @else if (summarized()) {
      <span class="tx-select__value" [class]="passThrough().value?.class" [style]="passThrough().value?.style">{{ summary() }}</span>
    } @else if (display() === 'chip') {
      <span class="tx-select__value tx-multiselect__chips" [class]="passThrough().value?.class" [style]="passThrough().value?.style">
        @for (item of selectedItems(); track item.id) {
          <span class="tx-multiselect__chip" [class]="passThrough().chip?.class" [style]="passThrough().chip?.style">
            <span class="tx-multiselect__chip-label">{{ item.label }}</span>
            @if (!disabled() && !readonly()) {
              <span class="tx-select__chip-remove" aria-hidden="true" (click)="removeItem(item, $event)">
                <tx-icon [name]="'times'" />
              </span>
            }
          </span>
        }
      </span>
    } @else {
      <span class="tx-select__value" [class]="passThrough().value?.class" [style]="passThrough().value?.style">{{ commaText() }}</span>
    }
  </button>
  @if (canClear()) {
    <button
      type="button"
      class="tx-select__clear"
      [class]="passThrough().clear?.class"
      [style]="passThrough().clear?.style"
      [attr.aria-label]="translations().clear"
      (click)="clear()"
    >
      <tx-icon [name]="'times'" />
    </button>
  }
  <span class="tx-select__dropdown" aria-hidden="true" [class]="passThrough().dropdown?.class" [style]="passThrough().dropdown?.style">
    @if (loading()) {
      <tx-icon class="tx-select__spinner" [name]="'spinner'" />
    } @else {
      <tx-icon class="tx-select__chevron" [name]="dropdownIcon()" />
    }
  </span>
</div>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="isPanelMounted()"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayScrollStrategy]="scrollStrategy"
  [cdkConnectedOverlayViewportMargin]="viewportMargin()"
  [cdkConnectedOverlayDisableClose]="true"
  [cdkConnectedOverlayWidth]="panelWidth()"
  (overlayOutsideClick)="onOutsideClick($event)"
  (attach)="onPanelAttach()"
  (positionChange)="onPositionChange($event)"
  (detach)="onPanelDetach()"
>
  <!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -- the panel only listens to keys and focus that bubble from its search field and actions -->
  <div
    #panel
    class="tx-select__panel"
    [attr.data-styled]="!isUnstyled() || null"
    [attr.data-size]="size()"
    [class]="passThrough().panel?.class"
    [style]="panelStyle()"
    (keydown)="onPanelKeydown($event)"
    (mousedown)="onPanelMousedown($event)"
    (focusout)="onPanelFocusOut($event)"
  >
    @if (headerTemplate(); as template) {
      <div class="tx-select__header" [class]="passThrough().header?.class" [style]="passThrough().header?.style">
        <ng-container [ngTemplateOutlet]="template.templateRef" />
      </div>
    }
    @if (filter() || showToggleAll()) {
      <div class="tx-select__filter" [class]="passThrough().filter?.class" [style]="passThrough().filter?.style">
        @if (showToggleAll()) {
          <button
            type="button"
            role="checkbox"
            class="tx-multiselect__toggle-all"
            [class]="passThrough().toggleAll?.class"
            [style]="passThrough().toggleAll?.style"
            [attr.aria-checked]="allChecked()"
            [attr.aria-label]="filter() ? translations().selectAll : null"
            (click)="toggleAll()"
          >
            <span class="tx-multiselect__box" aria-hidden="true">
              @if (allState() === 'all') {
                <tx-icon [name]="'check'" />
              } @else if (allState() === 'some') {
                <tx-icon [name]="'minus'" />
              }
            </span>
            @if (!filter()) {
              <span>{{ translations().selectAll }}</span>
            }
          </button>
        }
        @if (filter()) {
          <tx-icon class="tx-select__filter-icon" [name]="'search'" />
          <input
            #filterInput
            type="text"
            autocomplete="off"
            class="tx-select__filter-input"
            role="searchbox"
            [class]="passThrough().filterInput?.class"
            [style]="passThrough().filterInput?.style"
            [attr.aria-label]="filterPlaceholder() ?? translations().searchPlaceholder"
            [attr.aria-controls]="listboxId"
            [attr.aria-activedescendant]="activeItemId()"
            [placeholder]="filterPlaceholder() ?? translations().searchPlaceholder"
            [value]="query()"
            (input)="onFilterInput($event)"
            (keydown)="onKeydown($event)"
          />
        }
      </div>
    }
    <tx-option-list
      [rows]="rows()"
      [listboxId]="listboxId"
      [activeIndex]="activeIndex()"
      [multiple]="true"
      [virtualScroll]="virtualScroll()"
      [itemSize]="virtualScrollItemSize()"
      [scrollHeight]="scrollHeight()"
      [loading]="loading()"
      [query]="query()"
      [emptyText]="emptyText()"
      [loadingText]="translations().loading"
      [optionTemplate]="optionTemplate()?.templateRef"
      [groupTemplate]="groupTemplate()?.templateRef"
      [emptyTemplate]="emptyTemplate()?.templateRef"
      [emptyFilterTemplate]="emptyFilterTemplate()?.templateRef"
      [passThrough]="passThrough()"
      [unstyled]="isUnstyled()"
      (optionClick)="onOptionClick($event)"
      (optionHover)="activeIndex.set($event)"
      (rangeChange)="onRangeChange($event)"
    />
    @if (footerTemplate(); as template) {
      <div class="tx-select__footer" [class]="passThrough().footer?.class" [style]="passThrough().footer?.style">
        <ng-container [ngTemplateOutlet]="template.templateRef" />
      </div>
    }
  </div>
</ng-template>
