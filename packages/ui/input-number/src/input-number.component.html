@if (showButtons() && buttonLayout() !== 'stacked') {
  <button
    type="button"
    tabindex="-1"
    class="tx-input-number__button tx-input-number__decrement"
    [class]="passThrough().decrement?.class"
    [style]="passThrough().decrement?.style"
    [attr.aria-label]="translations().decrement"
    [disabled]="!canDecrement()"
    (pointerdown)="startRepeat(-1, $event)"
    (pointerup)="stopRepeat()"
    (pointerleave)="stopRepeat()"
    (pointercancel)="stopRepeat()"
  >
    @if (decrementIconName().name; as name) {
      <tx-icon [name]="name" />
    } @else {
      <span [class]="decrementIconName().className"></span>
    }
  </button>
}
<input
  #input
  txInput
  type="text"
  role="spinbutton"
  inputmode="decimal"
  autocomplete="off"
  class="tx-input-number__input"
  [class]="passThrough().input?.class"
  [style]="passThrough().input?.style"
  [id]="resolvedId()"
  [size]="size()"
  [variant]="variant()"
  [fluid]="true"
  [invalid]="isInvalid()"
  [unstyled]="isUnstyled()"
  [disabled]="isDisabled()"
  [readOnly]="readonly()"
  [required]="required()"
  [attr.placeholder]="placeholder() ?? null"
  [attr.name]="name() ?? null"
  [attr.tabindex]="tabindex() ?? null"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-labelledby]="ariaLabelledBy() ?? null"
  [attr.aria-valuenow]="value() ?? null"
  [attr.aria-valuemin]="min() ?? null"
  [attr.aria-valuemax]="max() ?? null"
  (input)="onInput($event)"
  (keydown)="onKeydown($event)"
  (focus)="onFocus()"
  (blur)="onBlur($event)"
/>
@if (showClear() && value() !== null && isEditable()) {
  <button
    type="button"
    class="tx-input-number__clear"
    [class]="passThrough().clear?.class"
    [style]="passThrough().clear?.style"
    [attr.aria-label]="translations().clear"
    [title]="translations().clear"
    (mousedown)="$event.preventDefault()"
    (click)="clear($event)"
  >
    <tx-icon [name]="'times'" />
  </button>
}
@if (showButtons()) {
  @if (buttonLayout() === 'stacked') {
    <span class="tx-input-number__stack">
      <ng-container [ngTemplateOutlet]="increment" />
      <ng-container [ngTemplateOutlet]="decrement" />
    </span>
  } @else {
    <ng-container [ngTemplateOutlet]="increment" />
  }
}

<ng-template #increment>
  <button
    type="button"
    tabindex="-1"
    class="tx-input-number__button tx-input-number__increment"
    [class]="passThrough().increment?.class"
    [style]="passThrough().increment?.style"
    [attr.aria-label]="translations().increment"
    [disabled]="!canIncrement()"
    (pointerdown)="startRepeat(1, $event)"
    (pointerup)="stopRepeat()"
    (pointerleave)="stopRepeat()"
    (pointercancel)="stopRepeat()"
  >
    @if (incrementIconName().name; as name) {
      <tx-icon [name]="name" />
    } @else {
      <span [class]="incrementIconName().className"></span>
    }
  </button>
</ng-template>
<ng-template #decrement>
  <button
    type="button"
    tabindex="-1"
    class="tx-input-number__button tx-input-number__decrement"
    [class]="passThrough().decrement?.class"
    [style]="passThrough().decrement?.style"
    [attr.aria-label]="translations().decrement"
    [disabled]="!canDecrement()"
    (pointerdown)="startRepeat(-1, $event)"
    (pointerup)="stopRepeat()"
    (pointerleave)="stopRepeat()"
    (pointercancel)="stopRepeat()"
  >
    @if (decrementIconName().name; as name) {
      <tx-icon [name]="name" />
    } @else {
      <span [class]="decrementIconName().className"></span>
    }
  </button>
</ng-template>
