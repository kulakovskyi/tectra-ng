<ng-template #content>
  <span class="tx-link__text" [class]="passThrough().text?.class" [style]="passThrough().text?.style">
    <tx-highlight-text [text]="displayText()" [highlight]="highlight()" />
  </span>
  @if (showExternal()) {
    <tx-icon class="tx-link__external" name="arrow-up-right" [class]="passThrough().external?.class" [style]="passThrough().external?.style" />
  }
  @if (opensNewTab()) {
    <span class="tx-link__hint">({{ translations().opensInNewTab }})</span>
  }
</ng-template>

@if (routerLink(); as commands) {
  <a class="tx-link__anchor" [routerLink]="$any(commands)" [attr.title]="fullTitle()" [class]="passThrough().anchor?.class" [style]="passThrough().anchor?.style">
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else {
  <a
    class="tx-link__anchor"
    [href]="href()"
    [attr.target]="resolvedTarget()"
    [attr.rel]="opensNewTab() ? 'noopener noreferrer' : null"
    [attr.title]="fullTitle()"
    [class]="passThrough().anchor?.class"
    [style]="passThrough().anchor?.style"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </a>
}
@if (copyable() && link()) {
  <button
    type="button"
    class="tx-link__copy"
    [class.tx-link__copy--done]="isCopied()"
    [class]="passThrough().copy?.class"
    [style]="passThrough().copy?.style"
    [attr.aria-label]="isCopied() ? translations().copied : copyLabel()"
    [title]="isCopied() ? translations().copied : copyLabel()"
    (click)="copy()"
  >
    <span class="tx-copy-swap" [class.tx-copy-swap--done]="isCopied()"><tx-icon class="tx-copy-swap__icon tx-copy-swap__icon--idle" name="copy" /><tx-icon class="tx-copy-swap__icon tx-copy-swap__icon--done" name="check" /></span>
  </button>
}
