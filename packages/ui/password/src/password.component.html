<input
  #input
  txInput
  class="tx-password__input"
  [class]="passThrough().input?.class"
  [style]="passThrough().input?.style"
  [type]="isMasked() ? 'password' : 'text'"
  [value]="text()"
  [id]="resolvedId()"
  [size]="size()"
  [variant]="variant()"
  [fluid]="true"
  [invalid]="isInvalid()"
  [unstyled]="isUnstyled()"
  [disabled]="isDisabled()"
  [readOnly]="readonly()"
  [required]="required()"
  [attr.placeholder]="placeholder() ?? null"
  [attr.maxlength]="maxlength() ?? null"
  [attr.name]="name() ?? null"
  [attr.autocomplete]="autocomplete()"
  [attr.tabindex]="tabindex() ?? null"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-labelledby]="ariaLabelledBy() ?? null"
  [attr.aria-describedby]="feedback() && isFocused() ? infoId : null"
  (input)="onInput($event)"
  (focus)="onFocus()"
  (blur)="onBlur()"
/>
<span class="tx-password__actions">
  @if (showClear() && hasValue() && isEditable()) {
    <button
      type="button"
      class="tx-password__action tx-password__clear"
      [class]="passThrough().clear?.class"
      [style]="passThrough().clear?.style"
      [attr.aria-label]="translations().clear"
      [title]="translations().clear"
      (mousedown)="$event.preventDefault()"
      (click)="clear()"
    >
      <tx-icon [name]="'times'" />
    </button>
  }
  @if (toggleMask()) {
    <button
      type="button"
      class="tx-password__action tx-password__toggle"
      [class]="passThrough().toggle?.class"
      [style]="passThrough().toggle?.style"
      [attr.aria-label]="translations().showPassword"
      [attr.aria-pressed]="!isMasked()"
      [attr.aria-controls]="resolvedId()"
      [title]="isMasked() ? translations().showPassword : translations().hidePassword"
      [disabled]="isDisabled()"
      (mousedown)="$event.preventDefault()"
      (click)="toggleVisibility()"
    >
      <tx-icon [name]="isMasked() ? 'eye' : 'eye-slash'" />
    </button>
  }
</span>

<ng-template #panel>
  <div class="tx-password__panel" [attr.data-styled]="!isUnstyled() || null" [style]="hostStyle()" [class]="passThrough().panel?.class">
    @if (headerTemplate(); as template) {
      <ng-container [ngTemplateOutlet]="template.templateRef" [ngTemplateOutletContext]="templateContext()" />
    }
    <div class="tx-password__meter" [attr.data-strength]="strength()" [class]="passThrough().meter?.class" [style]="passThrough().meter?.style">
      <span class="tx-password__meter-bar"></span>
    </div>
    <div class="tx-password__info" aria-live="polite" [id]="infoId" [class]="passThrough().info?.class" [style]="passThrough().info?.style">
      {{ info() }}
    </div>
    @if (contentTemplate(); as template) {
      <ng-container [ngTemplateOutlet]="template.templateRef" [ngTemplateOutletContext]="templateContext()" />
    }
    @if (footerTemplate(); as template) {
      <ng-container [ngTemplateOutlet]="template.templateRef" [ngTemplateOutletContext]="templateContext()" />
    }
  </div>
</ng-template>
