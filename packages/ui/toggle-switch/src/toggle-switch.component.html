<span class="tx-toggle-switch__track" [class]="passThrough().track?.class" [style]="passThrough().track?.style">
  <input
    #input
    type="checkbox"
    role="switch"
    class="tx-toggle-switch__input"
    [class]="passThrough().input?.class"
    [style]="passThrough().input?.style"
    [id]="resolvedId()"
    [checked]="checked()"
    [disabled]="isDisabled()"
    [required]="required()"
    [attr.aria-checked]="checked()"
    [attr.name]="name() ?? null"
    [attr.tabindex]="tabindex() ?? null"
    [attr.aria-label]="ariaLabel() ?? null"
    [attr.aria-labelledby]="ariaLabelledBy() ?? null"
    [attr.aria-describedby]="description() ? descriptionId : null"
    [attr.aria-invalid]="isInvalid() || null"
    [attr.aria-readonly]="readonly() || null"
    (click)="onInputClick($event)"
    (change)="onInputChange($event)"
    (blur)="onBlur()"
  />
  <span class="tx-toggle-switch__handle" aria-hidden="true" [class]="passThrough().handle?.class" [style]="passThrough().handle?.style">
    @if (handleTemplate(); as template) {
      <ng-container [ngTemplateOutlet]="template.templateRef" [ngTemplateOutletContext]="{ $implicit: checked() }" />
    } @else if (handleIcon(); as icon) {
      @if (handleIconName(); as name) {
        <tx-icon [name]="name" />
      } @else {
        <span [class]="icon"></span>
      }
    }
  </span>
</span>
<span class="tx-toggle-switch__text">
  <label class="tx-toggle-switch__label" [for]="resolvedId()" [class]="passThrough().label?.class" [style]="passThrough().label?.style"
    >@if (label()) {{{ label() }}}<ng-content
  /></label>
  @if (description()) {
    <span
      class="tx-toggle-switch__description"
      [id]="descriptionId"
      [class]="passThrough().description?.class"
      [style]="passThrough().description?.style"
      >{{ description() }}</span
    >
  }
</span>
