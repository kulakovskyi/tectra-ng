<img
  class="tx-image__image"
  [class]="passThrough().image?.class"
  [style]="passThrough().image?.style"
  [attr.src]="src() ?? null"
  [attr.srcset]="srcSet() ?? null"
  [attr.sizes]="sizes() ?? null"
  [attr.alt]="alt() ?? ''"
  [attr.width]="width() ?? null"
  [attr.height]="height() ?? null"
  [attr.loading]="loading() ?? null"
  (error)="imageFailed($event)"
/>
@if (preview()) {
  <button
    type="button"
    class="tx-image__preview"
    [class]="passThrough().previewButton?.class"
    [style]="passThrough().previewButton?.style"
    [attr.aria-label]="translations().zoomImage"
    aria-haspopup="dialog"
    [attr.aria-expanded]="visible()"
    (click)="open()"
  >
    @if (indicatorTemplate(); as indicator) {
      <ng-container [ngTemplateOutlet]="indicator.template" [ngTemplateOutletContext]="{ $implicit: fullSrc() }" />
    } @else {
      <tx-icon class="tx-image__preview-icon" [class]="passThrough().previewIcon?.class" [style]="passThrough().previewIcon?.style" [name]="previewIcon()" />
    }
  </button>
}

<ng-template #layer>
  <div
    class="tx-image-preview"
    role="dialog"
    aria-modal="true"
    [class]="passThrough().mask?.class"
    [style]="layerStyle()"
    [attr.data-styled]="!isUnstyled() || null"
    [attr.aria-label]="previewLabel()"
    (click)="onMaskClick($event)"
    (keydown)="onKeydown($event)"
  >
    <div class="tx-image-preview__backdrop" aria-hidden="true"></div>
    <div
      class="tx-image-preview__toolbar"
      role="toolbar"
      [class]="passThrough().toolbar?.class"
      [style]="passThrough().toolbar?.style"
      [attr.aria-label]="previewLabel()"
    >
      <button type="button" class="tx-image-preview__action" [class]="passThrough().action?.class" [style]="passThrough().action?.style" [attr.aria-label]="translations().rotateRight" (click)="rotateRight()">
        <tx-icon name="refresh" />
      </button>
      <button type="button" class="tx-image-preview__action" [class]="passThrough().action?.class" [style]="passThrough().action?.style" [attr.aria-label]="translations().rotateLeft" (click)="rotateLeft()">
        <tx-icon name="undo" />
      </button>
      <button
        type="button"
        class="tx-image-preview__action"
        [class]="passThrough().action?.class"
        [style]="passThrough().action?.style"
        [attr.aria-label]="translations().zoomOut"
        [disabled]="!canZoomOut()"
        (click)="zoomOut()"
      >
        <tx-icon name="search-minus" />
      </button>
      <button
        type="button"
        class="tx-image-preview__action"
        [class]="passThrough().action?.class"
        [style]="passThrough().action?.style"
        [attr.aria-label]="translations().zoomIn"
        [disabled]="!canZoomIn()"
        (click)="zoomIn()"
      >
        <tx-icon name="search-plus" />
      </button>
      <button
        type="button"
        class="tx-image-preview__action tx-image-preview__close"
        [class]="passThrough().action?.class"
        [style]="passThrough().action?.style"
        [attr.aria-label]="translations().close"
        (click)="close()"
      >
        <tx-icon name="times" />
      </button>
    </div>
    <div class="tx-image-preview__stage">
      @if (previewTemplate(); as custom) {
        <div class="tx-image-preview__custom">
          <ng-container [ngTemplateOutlet]="custom.template" [ngTemplateOutletContext]="previewContext()" />
        </div>
      } @else {
        <img
          class="tx-image-preview__original"
          draggable="false"
          [class]="passThrough().original?.class"
          [style]="passThrough().original?.style"
          [class.tx-image-preview__original--zoomed]="scale() > 1"
          [class.tx-image-preview__original--panning]="panning()"
          [style.transform]="transform()"
          [attr.src]="fullSrc()"
          [attr.srcset]="fullSrcSet() ?? null"
          [attr.sizes]="fullSizes() ?? null"
          [attr.alt]="alt() ?? ''"
          (wheel)="onWheel($event)"
          (dblclick)="onDoubleClick()"
          (pointerdown)="startPan($event)"
        />
      }
    </div>
  </div>
</ng-template>
