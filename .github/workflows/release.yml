name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'auto (from feat / fix commits), patch, minor, major, or an exact version like 0.3.0'
        default: auto
        required: true
      dist-tag:
        description: npm dist-tag
        type: choice
        options: [latest, next]
        default: latest

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/tectra-ng
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - run: npm ci --legacy-peer-deps
      - run: npx nx show projects > /dev/null
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
      - run: npm run lint
      - run: npm run test
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - id: release
        run: node tools/release.mjs "$VERSION_INPUT" "$DIST_TAG"
        env:
          VERSION_INPUT: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist-tag }}
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: attest
        if: steps.release.outputs.tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: GitHub release
        if: steps.release.outputs.tag != ''
        run: |
          cp "$BUNDLE" "release-assets/tectra-ng-$VERSION.intoto.jsonl"
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag release-assets/*
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Version pull request
        if: steps.release.outputs.tag != ''
        run: |
          gh pr create --base main --head "$BRANCH" --title "chore(release): $VERSION" \
            --body "Version bump and changelog of $TAG, already published to npm. Merges itself once the ci-ok check passes."
          gh pr merge "$BRANCH" --squash --auto
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
