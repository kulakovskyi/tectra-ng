name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'auto (from feat / fix commits), patch, minor, major, or an exact version like 0.3.0'
        default: auto
        required: true
      dist-tag:
        description: npm dist-tag
        type: choice
        options: [latest, next]
        default: latest

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/tectra-ng
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --legacy-peer-deps
      - run: npx nx show projects > /dev/null
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
      - run: npm run lint
      - run: npm run test
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - id: release
        run: node tools/release.mjs "${{ inputs.version }}" "${{ inputs.dist-tag }}"
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: attest
        if: steps.release.outputs.tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - if: steps.release.outputs.tag != ''
        run: |
          cp "$BUNDLE" "release-assets/tectra-ng-$VERSION.intoto.jsonl"
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag release-assets/*
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: gh workflow run ci.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
