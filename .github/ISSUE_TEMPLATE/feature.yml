name: Feature
description: A component, an input or a behaviour tectra should have
labels: [enhancement]
body:
  - type: input
    id: package
    attributes:
      label: Package or component
      placeholder: '@tectra-ng/ui/table'
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: What you need
      description: The use case first, then the API you have in mind.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: A workaround, or the same feature in another library.
