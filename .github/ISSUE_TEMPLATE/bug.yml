name: Bug
description: Something in a tectra package does not work as documented
labels: [bug]
body:
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: '@tectra-ng/ui/select 0.2.3'
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A minimal template and component, a StackBlitz link or the docs example that shows it.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS, Angular version
      placeholder: Chrome 140, macOS 16, Angular 22.2
  - type: dropdown
    id: ssr
    attributes:
      label: Server rendering
      options:
        - 'No'
        - 'Yes'
