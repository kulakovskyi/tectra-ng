<header class="header" txOverlayInset>
  <div class="header__start">
    <button txButton class="header__menu" [text]="true" [severity]="'secondary'" [icon]="isMenuOpen() ? 'times' : 'bars'" aria-label="Menu" (click)="toggleMenu()"></button>
    <a class="logo" routerLink="/" (click)="closeMenu()">
      <span class="logo__mark">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M12 7v12" /></svg>
      </span>
      <span class="logo__text">tectra</span>
      <span class="logo__version">0.0</span>
    </a>
    <nav class="header__nav">
      @for (link of headerLinks; track link.path) {
        <a
          class="header__link"
          [class.header__link--active]="currentUrl().startsWith(link.section)"
          [attr.aria-current]="currentUrl().startsWith(link.section) ? 'page' : null"
          [routerLink]="link.path"
          >{{ link.label }}</a
        >
      }
    </nav>
  </div>

  <div class="header__end">
    <button
      txButton
      [text]="true"
      [severity]="'secondary'"
      [rounded]="true"
      [rippleCentered]="true"
      [icon]="'palette'"
      [attr.aria-label]="'Theme settings'"
      [title]="'Theme settings'"
      [txPopoverTrigger]="themePanel"
    ></button>
    <tx-popover #themePanel [placement]="'bottom-end'" [arrow]="false" [ariaLabel]="'Theme settings'">
      <docs-theme-configurator />
    </tx-popover>
    <button
      txButton
      [text]="true"
      [severity]="'secondary'"
      [rounded]="true"
      [rippleCentered]="true"
      [icon]="mode() === 'light' ? 'moon' : 'sun'"
      [attr.aria-label]="mode() === 'light' ? 'Dark theme' : 'Light theme'"
      (click)="toggleMode($event)"
    ></button>
  </div>
</header>

<div class="body">
  <div class="backdrop" tabindex="-1" aria-hidden="true" [class.backdrop--visible]="isMenuOpen()" (click)="closeMenu()" (keydown.escape)="closeMenu()"></div>
  <nav class="sidebar" aria-label="Documentation" [class.sidebar--open]="isMenuOpen()">
    <docs-sidebar [currentUrl]="currentUrl()" (navigate)="closeMenu()" />
  </nav>

  <main class="content">
    <router-outlet />
  </main>
</div>
<tx-toast />
