<div class="configurator">
  <div class="configurator__section">
    <span class="configurator__label" [id]="id + '-primary'">Primary</span>
    <div class="configurator__swatches" role="radiogroup" [attr.aria-labelledby]="id + '-primary'">
      @for (option of primaries; track option.value) {
        <button
          type="button"
          role="radio"
          (keydown)="moveFocus($event)"
          class="configurator__swatch"
          [class.configurator__swatch--active]="settings.primary() === option.value"
          [style.--swatch]="option.color"
          [attr.aria-checked]="settings.primary() === option.value"
          [attr.aria-label]="option.label"
          [attr.tabindex]="settings.primary() === option.value ? 0 : -1"
          [title]="option.label"
          (click)="settings.update({ primary: option.value })"
        ></button>
      }
    </div>
  </div>

  <div class="configurator__section">
    <span class="configurator__label" [id]="id + '-surface'">Surface</span>
    <div class="configurator__swatches" role="radiogroup" [attr.aria-labelledby]="id + '-surface'">
      @for (option of surfaces; track option.value) {
        <button
          type="button"
          role="radio"
          (keydown)="moveFocus($event)"
          class="configurator__swatch"
          [class.configurator__swatch--active]="settings.surface() === option.value"
          [style.--swatch]="option.color"
          [attr.aria-checked]="settings.surface() === option.value"
          [attr.aria-label]="option.label"
          [attr.tabindex]="settings.surface() === option.value ? 0 : -1"
          [title]="option.label"
          (click)="settings.update({ surface: option.value })"
        ></button>
      }
    </div>
  </div>

  <div class="configurator__section">
    <span class="configurator__label" [id]="id + '-style'">Theme</span>
    <div class="configurator__segments" role="radiogroup" [attr.aria-labelledby]="id + '-style'">
      @for (option of styles; track option.value) {
        <button
          type="button"
          role="radio"
          (keydown)="moveFocus($event)"
          class="configurator__segment"
          [class.configurator__segment--active]="settings.style() === option.value"
          [attr.aria-checked]="settings.style() === option.value"
          [attr.tabindex]="settings.style() === option.value ? 0 : -1"
          (click)="settings.update({ style: option.value })"
        >
          {{ option.label }}
        </button>
      }
    </div>
  </div>

  <div class="configurator__row">
    <span class="configurator__label" [id]="id + '-ripple'">Ripple</span>
    <tx-toggle-switch [ariaLabelledBy]="id + '-ripple'" [ngModel]="settings.ripple()" (ngModelChange)="settings.setRipple($event)" />
  </div>
</div>
