<tx-public-header class="header" brand="tectra home" [preferences]="false" [dt]="headerTokens">
  <docs-logo txPublicHeaderBrand />
  <nav txPublicHeaderNav aria-label="Main">
    @for (link of nav; track link.path) {
      <a [routerLink]="link.path">{{ link.label }}</a>
    }
  </nav>
  <div txPublicHeaderActions>
    <button
      txButton
      text
      rounded
      severity="secondary"
      txThemeReveal
      [icon]="dark() ? 'sun' : 'moon'"
      [attr.aria-label]="dark() ? 'Light theme' : 'Dark theme'"
      (themeChange)="settings.toggleMode()"
    ></button>
    <a txButton text rounded severity="secondary" icon="github" aria-label="GitHub" target="_blank" rel="noopener" [href]="repository"></a>
    <a txButton rounded size="small" routerLink="/getting-started">Get started</a>
  </div>
</tx-public-header>

<main class="landing">
  <docs-landing-hero />
  <docs-landing-intro />
  <docs-landing-questions />
  <docs-landing-features />
  <docs-landing-glue />
  <docs-landing-stats />
  <docs-landing-catalog />
  <docs-landing-start />
  <docs-landing-faq />
  <docs-landing-closing />
</main>

<docs-site-footer />
