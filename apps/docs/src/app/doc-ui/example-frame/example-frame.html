<section class="example" [id]="example().id">
  <header class="example__head">
    <div class="example__titles">
      <h3 class="example__title">
        <a class="example__anchor" [href]="'#' + example().id">{{ example().title }}</a>
      </h3>
      <div class="example__description" [innerHTML]="example().descriptionHtml"></div>
    </div>
    <div class="example__actions">
      <button
        txButton
        [size]="'small'"
        [text]="true"
        [severity]="'secondary'"
        [icon]="isCopied() ? 'check' : 'copy'"
        [attr.aria-label]="'Copy code'"
        [title]="isCopied() ? 'Copied' : 'Copy code'"
        (click)="copyCode()"
      ></button>
      <button
        txButton
        [size]="'small'"
        [text]="true"
        [severity]="isCodeVisible() ? 'primary' : 'secondary'"
        [icon]="'code'"
        [attr.aria-label]="'Show code'"
        [attr.aria-expanded]="isCodeVisible()"
        [title]="isCodeVisible() ? 'Hide code' : 'Show code'"
        (click)="toggleCode()"
      ></button>
    </div>
  </header>

  <div class="example__card">
    <div class="example__preview">
      @if (component(); as component) {
        <ng-container [ngComponentOutlet]="component" />
      }
    </div>
    <div class="example__code" [class.example__code--open]="isCodeVisible()" [attr.aria-hidden]="isCodeVisible() ? null : true" [attr.inert]="isCodeVisible() ? null : ''">
      <div class="example__code-inner">
        <pre tabindex="0" [attr.aria-label]="example().title + ' code'"><code class="hljs" [innerHTML]="example().sourceHtml"></code></pre>
      </div>
    </div>
  </div>
</section>
