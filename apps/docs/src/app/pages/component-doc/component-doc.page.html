@if (doc(); as doc) {
  <p class="eyebrow">{{ doc.category }}</p>
  <h1>{{ doc.title }}</h1>
  <div class="description" [innerHTML]="doc.descriptionHtml"></div>
  <pre class="code"><code>{{ importLine() }}</code></pre>

  <div class="tabs" role="tablist">
    @for (tab of tabs; track tab.id) {
      <button
        type="button"
        role="tab"
        class="tabs__tab"
        [class.tabs__tab--active]="activeTab() === tab.id"
        [attr.aria-selected]="activeTab() === tab.id"
        (click)="activeTab.set(tab.id)"
      >{{ tab.label }}</button>
    }
  </div>

  @switch (activeTab()) {
    @case ('features') {
      <docs-features-tab [doc]="doc" />
    }
    @case ('api') {
      <docs-api-tab [doc]="doc" />
    }
    @case ('theming') {
      <docs-theming-tab [doc]="doc" />
    }
    @case ('a11y') {
      <docs-a11y-tab [doc]="doc" />
    }
  }
} @else {
  <h1>Not found</h1>
  <p class="lead">There is no component called "{{ name() }}".</p>
}
