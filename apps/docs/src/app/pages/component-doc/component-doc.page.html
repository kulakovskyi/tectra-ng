@if (doc(); as doc) {
  <header class="doc-head">
    <div class="doc-head__crumbs">
      <a routerLink="/components/button">Components</a>
      <tx-icon [name]="'angle-right'" />
      <span>{{ doc.category }}</span>
    </div>
    <h1 class="doc-head__title">{{ doc.title }}</h1>
    <div class="doc-head__lead" [innerHTML]="doc.descriptionHtml"></div>
    <button type="button" class="import" [attr.aria-label]="'Copy import: ' + importLine()" (click)="copyImport()">
      <code
        ><span class="hljs-keyword">import</span>{{ ' { ' }}<span class="hljs-title class_">{{ doc.importName }}</span>{{ ' } ' }}<span
          class="hljs-keyword"
          >from</span
        >{{ ' ' }}<span class="hljs-string">'{{ doc.importPath }}'</span>;</code
      >
      <span class="import__icon" [class.import__icon--done]="isImportCopied()">
        <tx-icon [name]="isImportCopied() ? 'check' : 'copy'" />
      </span>
    </button>
  </header>

  <div class="tabs-bar" txOverlayInset>
    <tx-tabs variant="pills" [ariaLabel]="doc.title + ' documentation'" [tabs]="docTabs()" [value]="activeTab()" (tabChange)="selectTab($event)" />
  </div>

  <div class="tab-panel">
    @switch (activeTab()) {
      @case ('features') {
        <docs-features-tab [doc]="doc" />
      }
      @case ('api') {
        <docs-api-tab [doc]="doc" />
      }
      @case ('theming') {
        <docs-theming-tab [doc]="doc" />
      }
      @case ('a11y') {
        <docs-a11y-tab [doc]="doc" />
      }
    }
  </div>
} @else {
  <h1 class="doc-head__title">Not found</h1>
  <p class="doc-head__lead">There is no component called "{{ name() }}".</p>
}
