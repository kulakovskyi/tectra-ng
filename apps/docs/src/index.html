<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tectra — Angular UI kit</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preload" href="fonts/onest-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/onest-latin-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/onest-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/onest-cyrillic-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="fonts/fonts.css" />
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('tx-docs-theme') || 'null');
        if (saved && saved.mode === 'dark') {
          document.documentElement.setAttribute('data-tx-theme', 'dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <docs-root></docs-root>
  </body>
</html>
